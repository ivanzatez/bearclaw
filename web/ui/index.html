<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Bearclaw</title>
    <meta name="description" content="Supervise and steer the Claude Code bearclaw" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16161c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bearclaw" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // Pre-paint theme (same rules as ThemeProvider): dark unless chosen/OS-preferred light, plus
      // the palette (lib/palettes.ts; theme-color = the palette's --background per mode).
      try {
        var t = localStorage.getItem('bearclaw.theme')
        var light = t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)
        var p = localStorage.getItem('bearclaw.palette')
        var colors = { claw: ['#16161c', '#fafafa'], default: ['#0b0c0e', '#ffffff'], earth: ['#1a1512', '#f7f2ea'], dusk: ['#121119', '#faf9fc'] }
        if (!colors.hasOwnProperty(p)) p = 'claw'
        if (light) document.documentElement.classList.remove('dark')
        if (p !== 'default') document.documentElement.dataset.palette = p
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[p][light ? 1 : 0])
      } catch (e) {}
      // Pre-paint text size (same rule as PrefsProvider / lib/prefs.ts rootFontSize): scales every rem.
      try {
        var f = localStorage.getItem('bearclaw.chatFont')
        if (f === '13' || f === '17') {
          document.documentElement.style.fontSize = f === '13' ? '86.667%' : '113.333%'
          document.documentElement.dataset.textSize = f
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:16px">Bearclaw needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
